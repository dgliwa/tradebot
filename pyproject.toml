[project]
name = "tradebot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.3.2",
    "python-dotenv==1.2.2",
    "httpx>=0.28.1,<0.29",
    "tenacity>=9.1.0,<10",
    "yfinance>=1.5.1,<2",
    "pandas-market-calendars>=5,<6",
]

[project.scripts]
tradebot = "tradebot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x -q"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.15",
    "freezegun==1.5.5",
    "respx>=0.22.0,<0.24",
    "hypothesis>=6.0",
]
